name: Build Nexus Social Android APK (Java + WebView Bridge)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Wrapper & Build Debug APK
        working-directory: ./android-apk
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Compiled Nexus Social APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-social-automation-apk
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
