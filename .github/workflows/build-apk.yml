name: Build Nexus Social Android APK (Java + WebView Bridge)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Build Debug APK
        working-directory: ./android-apk
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled Nexus Social APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-social-automation-apk
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
