name: Build Nexus Social Android APK (Java + WebView Bridge)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Normalize Pure Android SDK Config & Build APK with Gradle 8.7
        working-directory: ./android-apk
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          # 1. Self-heal Java & Manifest files to Pure Android SDK
          sed -i 's/import androidx.appcompat.app.AppCompatActivity;/import android.app.Activity;/g' app/src/main/java/com/devsaged/nexussocial/*.java
          sed -i 's/extends AppCompatActivity/extends Activity/g' app/src/main/java/com/devsaged/nexussocial/*.java
          sed -i 's/@style\/Theme.AppCompat.NoActionBar/@android:style\/Theme.DeviceDefault.NoActionBar/g' app/src/main/AndroidManifest.xml

          cat > app/src/main/java/com/devsaged/nexussocial/SessionBridge.java << 'EOF'
          package com.devsaged.nexussocial;

          import android.content.Context;
          import android.content.Intent;
          import android.webkit.JavascriptInterface;
          import org.json.JSONObject;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;

          public class SessionBridge {

              private final Context context;

              public SessionBridge(Context context) {
                  this.context = context;
              }

              @JavascriptInterface
              public void openPlatformLogin(String platform) {
                  Intent intent = new Intent(context, AccountLinkerActivity.class);
                  intent.putExtra("platform", platform);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  context.startActivity(intent);
              }

              @JavascriptInterface
              public void retryLocalServer() {
                  Intent intent = new Intent(context, MainActivity.class);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  context.startActivity(intent);
              }

              public static void sendCapturedSessionToTermux(
                      final String platform,
                      final String username,
                      final String cookieString,
                      final String userAgent
              ) {
                  new Thread(() -> {
                      try {
                          URL url = new URL(MainActivity.TERMUX_SERVER_URL + "/api/accounts/capture-session");
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                          conn.setConnectTimeout(5000);
                          conn.setReadTimeout(10000);
                          conn.setDoOutput(true);

                          JSONObject payload = new JSONObject();
                          payload.put("platform", platform == null ? "" : platform);
                          payload.put("username", username == null ? "" : username);
                          payload.put("cookie_string", cookieString == null ? "" : cookieString);
                          payload.put("user_agent", userAgent == null ? "" : userAgent);
                          String jsonPayload = payload.toString();

                          try (OutputStream os = conn.getOutputStream()) {
                              os.write(jsonPayload.getBytes(StandardCharsets.UTF_8));
                          }
                          conn.getResponseCode();
                          conn.disconnect();
                      } catch (Exception ignored) {
                      }
                  }).start();
              }
          }
          EOF

          cat > app/src/main/java/com/devsaged/nexussocial/NetworkWatchdogService.java << 'EOF'
          package com.devsaged.nexussocial;

          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.net.NetworkRequest;
          import android.os.IBinder;
          import org.json.JSONObject;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;

          public class NetworkWatchdogService extends Service {

              private ConnectivityManager connectivityManager;
              private ConnectivityManager.NetworkCallback networkCallback;

              @Override
              public void onCreate() {
                  super.onCreate();
                  connectivityManager = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                  if (connectivityManager != null) {
                      NetworkRequest request = new NetworkRequest.Builder()
                              .addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                              .build();
                      networkCallback = new ConnectivityManager.NetworkCallback() {
                          @Override
                          public void onAvailable(Network network) {
                              notifyTermuxWakeup("android_network_restored");
                          }
                      };
                      try {
                          connectivityManager.registerNetworkCallback(request, networkCallback);
                      } catch (Exception ignored) {
                      }
                  }
              }

              public static void notifyTermuxWakeup(final String reason) {
                  new Thread(() -> {
                      try {
                          URL url = new URL(MainActivity.TERMUX_SERVER_URL + "/api/system/wakeup");
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                          conn.setConnectTimeout(4000);
                          conn.setReadTimeout(15000);
                          conn.setDoOutput(true);

                          JSONObject payload = new JSONObject();
                          payload.put("source", reason == null ? "watchdog" : reason);
                          String body = payload.toString();

                          try (OutputStream os = conn.getOutputStream()) {
                              os.write(body.getBytes(StandardCharsets.UTF_8));
                          }
                          conn.getResponseCode();
                          conn.disconnect();
                      } catch (Exception ignored) {
                      }
                  }).start();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  notifyTermuxWakeup("watchdog_service_start");
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  if (connectivityManager != null && networkCallback != null) {
                      try {
                          connectivityManager.unregisterNetworkCallback(networkCallback);
                      } catch (Exception ignored) {
                      }
                  }
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.4.2' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.devsaged.nexussocial'
              compileSdk 34
              defaultConfig {
                  applicationId "com.devsaged.nexussocial"
                  minSdk 24
                  targetSdk 34
                  versionCode 22
                  versionName "2.0.2"
              }
              buildTypes {
                  release { minifyEnabled false }
                  debug {
                      applicationIdSuffix ".debug"
                      versionNameSuffix "-debug"
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
          }
          EOF

          # 2. Download exact Gradle 8.7
          curl -sSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7.zip
          unzip -q -o /tmp/gradle-8.7.zip -d /tmp

          # 3. Accept SDK licenses and compile APK
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi
          /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled Nexus Social APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-social-automation-apk
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
