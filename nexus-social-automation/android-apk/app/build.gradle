plugins {
    id 'com.android.application'
}

android {
    namespace 'com.devsaged.nexussocial'
    compileSdk 34

    defaultConfig {
        applicationId "com.devsaged.nexussocial"
        minSdk 24
        targetSdk 34
        versionCode 21
        versionName "2.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 100% Pure Native Android SDK (Zero external AndroidX dependencies!)
}
